<!DOCTYPE html>
<html>
<head>
    <title>Test Custom Element</title>
    <script src="http://localhost:8000/custom-element.js" defer></script>
</head>
<body>
    <h1>Test</h1>
    <payment-methods-manager id="my-element"></payment-methods-manager>

    <script>
        // Aspetta che il DOM sia pronto
        document.addEventListener('DOMContentLoaded', () => {
            const element = document.getElementById('my-element');
            // Imposta la proprietà manualmente per testare
            element.jwt = "un-token-di-test-statico";
            console.log('Proprietà jwt impostata:', element.jwt);
        });
    </script>
</body>
</html>
